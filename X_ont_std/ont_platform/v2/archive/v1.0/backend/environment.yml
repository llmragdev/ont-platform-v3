name: claud_be
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - fastapi>=0.111
      - uvicorn[standard]>=0.30
      - pydantic>=2.7
      - python-dotenv>=1.0
      - google-genai>=0.3
      - pytest>=8.0
      - httpx>=0.27
      # 선택: PostgreSQL Repository 사용 시
      - psycopg[binary]>=3.2
      # 선택: OpenTelemetry (없으면 자동 no-op)
      - opentelemetry-sdk>=1.27
      - opentelemetry-instrumentation-fastapi>=0.48b0
      - opentelemetry-exporter-otlp-proto-http>=1.27
